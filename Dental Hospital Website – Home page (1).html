l implants<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Permanent replacement for missing teeth that looks, feels and works like your own.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:52px;height:52px;border-radius:16px;background:#E6F3F2;display:flex;align-items:center;justify-content:center\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A7C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9h16\"><\u002Fpath><path d=\"M4 15h16\"><\u002Fpath><rect x=\"3\" y=\"7\" width=\"18\" height=\"10\" rx=\"3\"><\u002Frect><path d=\"M8 7v10M16 7v10\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Braces and aligners<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Metal, ceramic and clear options to straighten teeth for children, teens and adults.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:52px;height:52px;border-radius:16px;background:#E6F3F2;display:flex;align-items:center;justify-content:center\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A7C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 4-3 7-7 10z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Root canal treatment<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Relieve tooth pain and save a damaged tooth with a comfortable, single-visit approach where possible.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:52px;height:52px;border-radius:16px;background:#E6F3F2;display:flex;align-items:center;justify-content:center\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A7C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12a7 7 0 0 1 14 0\"><\u002Fpath><path d=\"M5 12v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3\"><\u002Fpath><path d=\"M9 12v2M12 12v2M15 12v2\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Crowns and veneers<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Custom-made, natural-looking restorations that repair chips, cracks and discoloured teeth.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:52px;height:52px;border-radius:16px;background:#E6F3F2;display:flex;align-items:center;justify-content:center\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A7C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><circle cx=\"17\" cy=\"9\" r=\"2.2\"><\u002Fcircle><path d=\"M3 20c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5\"><\u002Fpath><path d=\"M16 14.5c2.5 0 4.3 1.6 5 4.5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Children's dentistry<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">A friendly space and patient dentists that help young children feel relaxed about check-ups.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Why us -->\n<div id=\"why\" style=\"background:#0A2A33;color:#FFFFFF;padding:96px clamp(16px,5vw,72px);display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start\">\n<div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7FD1CD\">Why ICLD<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">A hospital that treats the person, not just the tooth<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.7;color:#BCD9D7;max-width:480px\">We explain every step, show you your X-rays and agree the plan with you before we begin.<\u002Fp>\n<a href=\"#book\" style=\"align-self:flex-start;background:#FFFFFF;color:#0A2A33;padding:15px 28px;border-radius:999px;font-weight:700;font-size:16px\">Talk to our team<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 460px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n<div style=\"background:#12404A;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:20px\">Modern equipment<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#BCD9D7\">Digital X-rays and intraoral cameras for accurate, low-radiation diagnosis.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#12404A;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:20px\">Comfort first<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#BCD9D7\">Gentle numbing, calm rooms and breaks whenever you need them.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#12404A;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:20px\">Specialists together<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#BCD9D7\">Orthodontics, implants and endodontics handled by dedicated specialists in one place.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#12404A;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:20px\">Honest treatment plans<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#BCD9D7\">You get a written plan and cost estimate, with no unnecessary procedures.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Clinic gallery -->\n<div id=\"clinic\" style=\"padding:96px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:20px 48px;justify-content:space-between;align-items:flex-end\">\n<div style=\"display:flex;flex-direction:column;gap:14px;flex:1 1 420px;min-width:0\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0B6264\">Our clinic<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">A clean, calm space you can trust<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin:0;flex:1 1 320px;min-width:0;max-width:420px;font-size:17px;line-height:1.6;color:#2F4F58\">Demo images shown here. Replace them with photos of your own clinic.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"border-radius:24px;overflow:hidden;background:#CDE6E4\">\n<svg sc-camel-view-box=\"0 0 400 300\" style=\"display:block;width:100%;height:auto\" role=\"img\" aria-label=\"Demo illustration of a dental treatment room\">\n<rect width=\"400\" height=\"300\" fill=\"#D8ECEA\"><\u002Frect><rect y=\"215\" width=\"400\" height=\"85\" fill=\"#A9D3D0\"><\u002Frect >\n<\u002Fdiv>\n<b style=\"font-family:'Outfit',sans-serif;font-size:18px\">Sterilised instruments<\u002Fb>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"border-radius:24px;overflow:hidden;background:#E6F3F2\">\n<svg sc-camel-view-box=\"0 0 400 300\" style=\"display:block;width:100%;height:auto\" role=\"img\" aria-label=\"Demo illustration of a patient waiting area\">\n<rect width=\"400\" height=\"300\" fill=\"#E6F3F2\"><\u002Frect><rect y=\"226\" width=\"400\" height=\"74\" fill=\"#BFE0DD\"><\u002Frect>\n<rect x=\"250\" y=\"44\" width=\"100\" height=\"70\" rx=\"6\" fill=\"#FFFFFF\"><\u002Frect><path d=\"M270 70h60M270 90h40\" stroke=\"#BCD9D7\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n<rect x=\"60\" y=\"150\" width=\"210\" height=\"60\" rx=\"16\" fill=\"#0B7A7C\"><\u002Frect><rect x=\"48\" y=\"170\" width=\"34\" height=\"56\" rx=\"14\" fill=\"#0A2A33\"><\u002Frect><rect x=\"248\" y=\"170\" width=\"34\" height=\"56\" rx=\"14\" fill=\"#0A2A33\"><\u002Frect>\n<rect x=\"92\" y=\"130\" width=\"70\" height=\"40\" rx=\"14\" fill=\"#14666B\"><\u002Frect><rect x=\"170\" y=\"130\" width=\"70\" height=\"40\" rx=\"14\" fill=\"#14666B\"><\u002Frect>\n<rect x=\"72\" y=\"226\" width=\"10\" height=\"16\" fill=\"#0A2A33\"><\u002Frect><rect x=\"248\" y=\"226\" width=\"10\" height=\"16\" fill=\"#0A2A33\"><\u002Frect>\n<rect x=\"318\" y=\"200\" width=\"46\" height=\"40\" rx=\"8\" fill=\"#FFFFFF\"><\u002Frect><path d=\"M341 200c-18-22-24-44-8-70 14 16 20 42 8 70zM341 200c18-18 22-38 10-58-12 12-14 34-10 58z\" fill=\"#5BB5AE\"><\u002Fpath>\n<\u002Fsvg>\n<\u002Fdiv>\n<b style=\"font-family:'Outfit',sans-serif;font-size:18px\">Waiting area<\u002Fb>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Process -->\n<div id=\"process\" style=\"padding:96px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0B6264\">Your visit<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">Four simple steps from booking to a healthier smile<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:3px solid #0B7A7C\">\n<span style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:#0B6264\">Step 1<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Book online or by phone<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Choose a time that suits you. Emergency slots are kept for urgent pain.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:3px solid #0B7A7C\">\n<span style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:#0B6264\">Step 2<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Examination and X-ray<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Your dentist checks teeth and gums and shows you what they find.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:3px solid #0B7A7C\">\n<span style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:#0B6264\">Step 3<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">A plan you agree to<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Treatment options, timing and cost are explained clearly before we start.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:3px solid #0B7A7C\">\n<span style=\"font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:#0B6264\">Step 4<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:21px\">Treatment and follow-up<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">We treat you gently and check in afterwards to make sure you heal well.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Team -->\n<div id=\"team\" style=\"background:#E6F3F2;padding:96px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0B6264\">Our doctors<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">Meet the dentists looking after you<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n<div style=\"background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"aspect-ratio:4/3;max-width:100%;border-radius:16px;background:#CDE6E4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 120 90\" style=\"width:60%\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"34\" r=\"20\" fill=\"#0B7A7C\"><\u002Fcircle><path d=\"M14 90c3-24 22-34 46-34s43 10 46 34z\" fill=\"#0B7A7C\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'Outfit',sans-serif;font-size:20px\">[Doctor name]<\u002Fb><span style=\"font-size:15px;color:#4A6670\">[Specialty, e.g. Orthodontist]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"aspect-ratio:4/3;max-width:100%;border-radius:16px;background:#CDE6E4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 120 90\" style=\"width:60%\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"34\" r=\"20\" fill=\"#0B7A7C\"><\u002Fcircle><path d=\"M14 90c3-24 22-34 46-34s43 10 46 34z\" fill=\"#0B7A7C\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'Outfit',sans-serif;font-size:20px\">[Doctor name]<\u002Fb><span style=\"font-size:15px;color:#4A6670\">[Specialty, e.g. Implantologist]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"aspect-ratio:4/3;max-width:100%;border-radius:16px;background:#CDE6E4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 120 90\" style=\"width:60%\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"34\" r=\"20\" fill=\"#0B7A7C\"><\u002Fcircle><path d=\"M14 90c3-24 22-34 46-34s43 10 46 34z\" fill=\"#0B7A7C\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'Outfit',sans-serif;font-size:20px\">[Doctor name]<\u002Fb><span style=\"font-size:15px;color:#4A6670\">[Specialty, e.g. Paediatric dentist]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Reviews -->\n<div id=\"reviews\" style=\"padding:96px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:48px;background:#FFFFFF;border-top:1px solid #DCEBEA\">\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0B6264\">Patient reviews<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">What our patients say<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n<div style=\"background:#F6FAFA;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<span role=\"img\" aria-label=\"Five stars\" style=\"font-size:20px;letter-spacing:3px;color:#B7790A\">★★★★★<\u002Fspan>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#2F4F58\">[Add a real patient review here]<\u002Fp>\n<b style=\"font-family:'Outfit',sans-serif\">[Patient name]<\u002Fb>\n<\u002Fdiv>\n<div style=\"background:#F6FAFA;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<span role=\"img\" aria-label=\"Five stars\" style=\"font-size:20px;letter-spacing:3px;color:#B7790A\">★★★★★<\u002Fspan>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#2F4F58\">[Add a real patient review here]<\u002Fp>\n<b style=\"font-family:'Outfit',sans-serif\">[Patient name]<\u002Fb>\n<\u002Fdiv>\n<div style=\"background:#F6FAFA;border:1px solid #DCEBEA;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n<span role=\"img\" aria-label=\"Five stars\" style=\"font-size:20px;letter-spacing:3px;color:#B7790A\">★★★★★<\u002Fspan>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#2F4F58\">[Add a real patient review here]<\u002Fp>\n<b style=\"font-family:'Outfit',sans-serif\">[Patient name]<\u002Fb>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FAQ -->\n<div id=\"faq\" style=\"padding:96px clamp(16px,5vw,72px);display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n<div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#0B6264\">Questions<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(32px,3.8vw,48px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">Before you visit<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1.6 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n<details style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:18px;padding:20px 24px\">\n<summary style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:18px\">Is dental treatment painful?<\u002Fsummary>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#4A6670\">We use local anaesthesia and gentle techniques so most treatments cause little or no pain. Tell us if you feel anxious and we will go at your pace.<\u002Fp>\n<\u002Fdetails>\n<details style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:18px;padding:20px 24px\">\n<summary style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:18px\">How often should I get a check-up?<\u002Fsummary>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#4A6670\">Most people should visit every six months for a check-up and cleaning. Your dentist may suggest a different schedule based on your needs.<\u002Fp>\n<\u002Fdetails>\n<details style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:18px;padding:20px 24px\">\n<summary style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:18px\">Do you treat dental emergencies?<\u002Fsummary>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#4A6670\">Yes. Call our emergency line for severe pain, swelling, knocked-out teeth or broken fillings, and we will find you the earliest slot.<\u002Fp>\n<\u002Fdetails>\n<details style=\"background:#FFFFFF;border:1px solid #DCEBEA;border-radius:18px;padding:20px 24px\">\n<summary style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:18px\">Can I know the cost before treatment?<\u002Fsummary>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#4A6670\">Yes. After your examination we give you a written treatment plan with an estimated cost, so there are no surprises.<\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Visit us -->\n<div id=\"visit\" style=\"padding:96px clamp(16px,5vw,72px);display:flex;flex-wrap:wrap;gap:32px;align-items:stretch\">\n<div style=\"flex:1 1 340px;min-width:0;background:#FFFFFF;border:1px solid #DCEBEA;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:20px\">\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:30px\">Opening hours<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:0;font-size:16px\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #DCEBEA\"><span>Monday to Friday<\u002Fspan><b>[00:00 to 00:00]<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #DCEBEA\"><span>Saturday<\u002Fspan><b>[00:00 to 00:00]<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #DCEBEA\"><span>Sunday<\u002Fspan><b>[Closed or hours]<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A6670\">Dental emergencies: call our emergency line at any time during opening hours.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 420px;min-width:0;min-height:320px;background:#CDE6E4;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center\">\n<svg width=\"56\" height=\"64\" sc-camel-view-box=\"0 0 24 28\" fill=\"none\" stroke=\"#0A2A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 26s8-7.2 8-14a8 8 0 0 0-16 0c0 6.8 8 14 8 14z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n<b style=\"font-family:'Outfit',sans-serif;font-size:22px\">Find us here<\u002Fb>\n<span style=\"font-size:16px;color:#2F4F58;max-width:360px;line-height:1.6\">[Clinic address, city]. Add your Google Maps location here.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Booking -->\n<div id=\"book\" style=\"background:#0B7A7C;padding:96px clamp(16px,5vw,72px);display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n<div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px;color:#FFFFFF\">\n<h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(34px,4.2vw,54px);line-height:1.08;letter-spacing:-0.01em;text-wrap:balance\">Book your appointment today<\u002Fh2>\n<p style=\"margin:0;font-size:18px;line-height:1.6;color:#E3F4F3;max-width:460px\">Leave your details and our team will call you to confirm a time.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:6px;font-size:16px;color:#E3F4F3\">\n<span>Phone: [+92 000 0000000]<\u002Fspan>\n<span>WhatsApp: [+92 300 0000000]<\u002Fspan>\n<span>Address: [Clinic address, city]<\u002Fspan>\n<span>Hours: [Mon to Sat, opening hours]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;min-width:0;background:#FFFFFF;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:16px;color:#0A2A33\">\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"f-name\" style=\"font-size:14px;font-weight:700\">Full name<\u002Flabel>\n<input id=\"f-name\" type=\"text\" placeholder=\"Your name\" style=\"font:inherit;font-size:16px;padding:14px 16px;border:1px solid #BCD9D7;border-radius:12px;background:#F6FAFA;min-width:0;box-sizing:border-box;width:100%\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"f-phone\" style=\"font-size:14px;font-weight:700\">Phone number<\u002Flabel>\n<input id=\"f-phone\" type=\"tel\" placeholder=\"0300 0000000\" style=\"font:inherit;font-size:16px;padding:14px 16px;border:1px solid #BCD9D7;border-radius:12px;background:#F6FAFA;min-width:0;box-sizing:border-box;width:100%\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"f-service\" style=\"font-size:14px;font-weight:700\">Treatment<\u002Flabel>\n<input id=\"f-service\" type=\"text\" placeholder=\"e.g. Check-up, whitening, braces\" style=\"font:inherit;font-size:16px;padding:14px 16px;border:1px solid #BCD9D7;border-radius:12px;background:#F6FAFA;min-width:0;box-sizing:border-box;width:100%\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"f-date\" style=\"font-size:14px;font-weight:700\">Preferred date<\u002Flabel>\n<input id=\"f-date\" type=\"date\" style=\"font:inherit;font-size:16px;padding:14px 16px;border:1px solid #BCD9D7;border-radius:12px;background:#F6FAFA;min-width:0;box-sizing:border-box;width:100%\">\n<\u002Fdiv>\n<button type=\"button\" style=\"font:inherit;font-weight:700;font-size:16px;background:#0A2A33;color:#FFFFFF;border:0;border-radius:999px;padding:16px 28px;min-height:48px;cursor:pointer\">Request appointment<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Footer -->\n<div style=\"background:#0A2A33;color:#BCD9D7;padding:48px clamp(16px,5vw,72px);display:flex;flex-wrap:wrap;gap:24px 48px;justify-content:space-between;align-items:center;font-size:14px\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<div style=\"width:38px;height:38px;border-radius:10px;background:#0B7A7C;display:flex;align-items:center;justify-content:center\">\n<svg width=\"22\" height=\"24\" sc-camel-view-box=\"0 0 100 110\" aria-hidden=\"true\"><path d=\"M50 12 C40 4 22 6 18 24 C15 38 24 50 26 66 C28 82 31 100 40 100 C48 100 47 82 50 78 C53 82 52 100 60 100 C69 100 72 82 74 66 C76 50 85 38 82 24 C78 6 60 4 50 12 Z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<span style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:18px;color:#FFFFFF\">ICLD Dental Hospital<\u002Fspan>\n<\u002Fdiv>\n<span>Copyright 2026 ICLD Dental Hospital. All rights reserved.<\u002Fspan>\n<\u002Fdiv>\n\n<!-- Floating WhatsApp button -->\n<a href=\"https://wa.me/923000000000\" aria-
